name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip NspExtract.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
      - run: git clone --recursive https://github.com/SciresM/hactool NspExtract/app/src/main/cpp/hactool
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug
        working-directory: NspExtract
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: NspExtract/app/build/outputs/apk/debug/*.apk
